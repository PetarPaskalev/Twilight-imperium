services:
  - type: web
    name: twilight-imperium-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn twilight_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false