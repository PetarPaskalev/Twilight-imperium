# render.yaml
services:
  - type: web
    name: twilight-imperium-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn twilight_api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY     # set in Render dashboard (do not commit)
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://twilight-imperium-rose.vercel.app
      - key: SESSION_TTL_SECONDS
        value: "604800"
      # Optional if you add Redis later:
      # - key: REDIS_URL
      #   sync: false